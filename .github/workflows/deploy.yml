name: Deploy Pamoja Wealth

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Backend CI ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../pamoja-wealth-backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pamoja
          POSTGRES_PASSWORD: pamoja_test
          POSTGRES_DB: pamoja_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aming/pamoja-wealth-backend
          path: pamoja-wealth-backend
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm', cache-dependency-path: pamoja-wealth-backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
        env:
          DATABASE_URL: postgresql://pamoja:pamoja_test@localhost:5432/pamoja_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef

  # ── Frontend CI ────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npx tsc -b --noEmit
        continue-on-error: true
      - run: npm run build
      - run: npm run test:smoke
        continue-on-error: true

  # ── Backend Deploy ─────────────────────────────────────────────────────
  backend-deploy:
    name: Backend — Deploy to Fly.io
    needs: backend-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aming/pamoja-wealth-backend
          path: backend
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: cd backend && flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Frontend Deploy ────────────────────────────────────────────────────
  frontend-deploy:
    name: Frontend — Deploy to Vercel
    needs: frontend-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ── Mobile Build (EAS) ─────────────────────────────────────────────────
  mobile-build:
    name: Mobile — EAS Build (iOS + Android)
    needs: [backend-deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: EAS Build
        run: eas build --platform all --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VITE_API_BASE_URL: https://api.pamojawealth.app/v1
          VITE_USE_MOCKS: false

  # ── Smoke Test ─────────────────────────────────────────────────────────
  smoke-test:
    name: Production Smoke Test
    needs: [backend-deploy, frontend-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Health check API
        run: |
          sleep 30  # Wait for deploy to propagate
          curl -f https://api.pamojawealth.app/v1/health || echo "API health check failed (may need DNS propagation)"
      - name: Health check Frontend
        run: |
          curl -f https://app.pamojawealth.app || echo "Frontend health check failed (may need DNS propagation)"
