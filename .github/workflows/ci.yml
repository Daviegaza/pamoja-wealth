name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint · TypeCheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  bundle-budget:
    name: Bundle-size guard
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Enforce main chunk under 100kB gzipped
        run: |
          MAIN=$(find dist/assets -name "index-*.js" -type f | head -1)
          SIZE_KB=$(gzip -c "$MAIN" | wc -c | awk '{print int($1/1024)}')
          echo "Main chunk gzipped ${SIZE_KB}kB"
          if [ "$SIZE_KB" -gt 100 ]; then
            echo "::error::Main chunk over 100kB gzipped"
            exit 1
          fi

  e2e-smoke:
    name: Playwright smoke (headless)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node e2e/smoke.mjs
        env:
          VITE_USE_MOCKS: "true"
